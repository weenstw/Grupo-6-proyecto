<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Mi perfil - eMercado</title>
  <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,700,900" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-1">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav w-100 justify-content-between">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categorías</a></li>
          <li class="nav-item"><a class="nav-link" href="sell.html">Vender</a></li>
          <li class="nav-item" id="boton">

            <img id="navProfileImage" src="img/img_perfil.png" alt="perfil"
              style="width:30px; height:30px; border-radius:50%;">
            <div id="dropdown">
              <p id="usrname"></p>
              <a href="my-profile.html">Mi perfil</a>
              <a href="" id="logout">Cerrar sesión</a>
              <div class="form-check form-switch text-light mt-2">
                <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                <label class="form-check-label" for="darkModeSwitch">Modo oscuro</label>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h2 class="mb-4 text-center">Mi perfil</h2>

    <form id="profileForm" class="mx-auto" style="max-width: 400px;">
      <div class="text-center mb-3">
        <img id="profileImage" src="img/img_perfil.png" alt="Foto de perfil" class="rounded-circle mb-2"
          style="width: 120px; height: 120px; object-fit: cover;">
        <div>
          <input type="file" id="imageInput" accept="image/*" class="form-control mt-2">
        </div>
      </div>

      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
      </div>

      <div class="mb-3">
        <label for="apellido" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="apellido" placeholder="Tu apellido">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" readonly>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono de contacto</label>
        <input type="tel" class="form-control" id="telefono" placeholder="Tu teléfono">
      </div>

      <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
    </form>

    <div id="alerta" class="alert alert-success text-center mt-3 d-none" role="alert">
      Cambios guardados correctamente
    </div>
  </main>

  <footer class="text-muted">
    <div class="container">
      <p class="float-end">
        <a href="#">Volver arriba</a>
      </p>
      <p>Este sitio forma parte de <a href="https://jovenesaprogramar.edu.uy/" target="_blank">Jovenes a Programar</a>
      </p>
    </div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/my-profile.js"></script>
</body>

</html>
