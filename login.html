<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eMercado - Todo lo que busques está aquí</title>
    <link rel="stylesheet" href="css/stylelogin.css">
</head>

<body>
    <div class="container">
        <form action="" class="loginForm" id="loginForm">
            <div class="imagen"><img src="img/Logo-ceibal.svg.png"></div>
            <input type="email" placeholder="Usuario" id="usuario" required>
            <input type="password" placeholder="Contraseña" id="contrasena" required>
            <input type="submit" value="Ingresar">
        </form>
        <div class="image-box"></div>
    </div>
</body>
<script src="js/login.js"></script>
</html>
