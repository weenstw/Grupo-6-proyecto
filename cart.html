<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Carrito de Compras - eMercado</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css?family=Raleway:300,300i,400,400i,700,700i,900,900i" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/font-awesome.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-1">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav w-100 justify-content-between">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categorías</a></li>
          <li class="nav-item"><a class="nav-link" href="sell.html">Vender</a></li>



          <!-- Perfil -->
          <li class="nav-item" id="boton">
            <img id="navProfileImage" src="img/img_perfil.png" alt="perfil"
              style="width:30px; height:30px; border-radius:50%;">
            <div id="dropdown">
              <p id="usrname"></p>
              <a href="my-profile.html">Mi perfil</a>
              <a href="" id="logout">Cerrar sesión</a>
              <div class="form-check form-switch text-light mt-2">
                <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                <label class="form-check-label" for="darkModeSwitch">Modo oscuro</label>
              </div>
            </div>
          </li>
          <!-- Carrito -->
          <li class="nav-item position-relative">
            <a class="nav-link active" href="cart.html" id="cartIcon">
              <i class="fa-solid fa-cart-shopping"></i>
              <span id="cartCount" class="cart-count">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <main class="container my-4">
    <h2 class="mb-4">Carrito de Compras</h2>
    <div id="carritoContainer"></div>
    <hr>
    <div class="text-end mt-3">
      <h4>Total: <span id="totalCarrito">0</span></h4>
      <button class="btn btn-success">Proceder al pago</button>
      <div class="mt-3">
        <img src="img/Logos-01.png" alt="Métodos de pago aceptados" style="max-width: 280px;">
      </div>
    </div>

  </main>

  <footer class="text-muted mt-5">
    <div class="container">
      <p class="float-end"><a href="#">Volver arriba</a></p>
      <p>Este sitio forma parte de <a href="https://jovenesaprogramar.edu.uy/" target="_blank">Jóvenes a Programar</a>
      </p>
    </div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/init.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
